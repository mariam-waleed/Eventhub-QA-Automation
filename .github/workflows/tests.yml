name: EventHub tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping CI runs using the same test account.
concurrency:
  group: eventhub-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      WEB_BASE_URL: https://eventhub.rahulshettyacademy.com
      API_BASE_URL: https://api.eventhub.rahulshettyacademy.com/api/
      TEST_EVENT_ID: "285"
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API and UI tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore